name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Uses committed cache/ NPZ + system_contents if present; otherwise
      # export_godot.py generates the map (cache HTML junk stays gitignored).
      - name: Generate map cache + export Godot data
        run: python export_godot.py

      # Matches godot/project.godot config/features ("4.7").
      # Action installs the engine binary + official export templates.
      - name: Setup Godot
        uses: solarlabyrinth/action-setup-godot@v2
        with:
          version: 4.7.1-stable
          csharp: false

      - name: Export Godot Web
        run: |
          mkdir -p build/web
          godot --headless --path godot --import --quit
          godot --headless --path godot --export-release "Web" "${GITHUB_WORKSPACE}/build/web/index.html"
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
